services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AGENTS_DATA_DIR: ${AGENTS_DATA_DIR:-client/data}
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    env_file:
      - .env
    environment:
      POLL_EVENTS: ${POLL_EVENTS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 5000
      AGENTS_DATA_DIR: ${AGENTS_DATA_DIR:-client/data}
    restart: unless-stopped
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:5000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.54.1
    depends_on:
      fastapi:
        condition: service_healthy
      node:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    restart: unless-stopped
    ports:
      - "9090:9090"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana.dashboard.json:/var/lib/grafana/dashboards/chatterbate-backend-overview.json:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      fastapi:
        condition: service_healthy
      node:
        condition: service_healthy
      grafana:
        condition: service_healthy
    volumes:
      - ./deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/healthz || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  grafana-data:
