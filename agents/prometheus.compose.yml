global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: chatterbate_fastapi
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - fastapi:8000

  - job_name: chatterbate_node
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - node:5000
