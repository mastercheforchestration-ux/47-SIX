services:
  fastapi:
    image: python:3.11-slim
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - ./:/workspace
    command: >-
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      python -m uvicorn client.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  node:
    image: node:20
    working_dir: /workspace
    env_file:
      - .env
    environment:
      POLL_EVENTS: "false"
    volumes:
      - ./:/workspace
    command: sh -c "npm ci && npm start"
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:5000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  prometheus:
    image: prom/prometheus:v2.54.1
    depends_on:
      fastapi:
        condition: service_healthy
      node:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana.dashboard.json:/var/lib/grafana/dashboards/chatterbate-backend-overview.json:ro
    ports:
      - "3001:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
