name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Node)
        id: meta_node
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/node
          tags: |
            type=ref,event=tag
            type=sha

      - name: Extract Docker metadata (FastAPI)
        id: meta_fastapi
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/fastapi
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and push Node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.node
          push: true
          tags: ${{ steps.meta_node.outputs.tags }}
          labels: ${{ steps.meta_node.outputs.labels }}

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fastapi
          push: true
          tags: ${{ steps.meta_fastapi.outputs.tags }}
          labels: ${{ steps.meta_fastapi.outputs.labels }}
