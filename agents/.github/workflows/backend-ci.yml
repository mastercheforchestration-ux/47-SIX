name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      CB_USERNAME: ci-user
      CB_PASSWORD: ci-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python backend tests
        run: python -m unittest discover -s test -p "test_*.py"

      - name: Run Node backend tests
        run: npm test

      - name: Health probe both backends
        run: |
          python -m uvicorn client.main:app --host 127.0.0.1 --port 8000 > fastapi.log 2>&1 &
          node index.js > node.log 2>&1 &
          sleep 5
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/metrics
          curl --fail http://127.0.0.1:8000/metrics/prometheus
          curl --fail http://127.0.0.1:5000/health
          curl --fail http://127.0.0.1:5000/metrics
          curl --fail http://127.0.0.1:5000/metrics/prometheus